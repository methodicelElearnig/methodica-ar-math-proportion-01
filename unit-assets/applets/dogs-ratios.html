<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهمة النسب - أوزان الكلاب 🐾</title>
    <style>
        body {
            font-family: Calibri, Carlito, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf8f5; /* רקע שמנת חמים */
            color: #5d4037; /* צבע טקסט גלובלי חום כהה */
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
        }
        
        .title-container {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .title-container h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            color: #5d4037;
        }

        .title-container p {
            margin: 0;
            font-size: 18px;
            color: #8d6e63;
            font-weight: 500;
        }

        /* מכלול הטבלה - תומך כעת בגלילה במסכים קטנים */
        .table-container {
            width: 100%;
            max-width: 900px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(141, 110, 99, 0.15);
            border: 2px solid #8d6e63;
            /* 15.09.26 — the unit forbids a horizontal scrollbar anywhere;
               the table is sized to fit the frame instead. */
            overflow-x: hidden;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 0;
            font-size: 19px;
            color: #5d4037; /* הבטחת צבע טקסט כהה וברור בתוך הטבלה */
        }

        th, td {
            padding: 16px 10px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid #f1ebe7;
        }

        th:not(:last-child), td:not(:last-child) {
            border-left: 1px solid #f1ebe7;
        }

        th {
            background-color: #8d6e63;
            color: white; /* כותרות בלבן על רקע חום */
            font-weight: 600;
            font-size: 18px;
        }

        tr:hover {
            background-color: #fffbf9;
        }

        .breed-cell {
            font-weight: bold;
            color: #5d4037;
            font-size: 20px;
        }

        .fraction-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .fraction-input {
            width: 60px;
            height: 32px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #5d4037;
            border: 2px dashed #bcaaa4;
            border-radius: 6px;
            outline: none;
            background-color: #faf8f7;
            transition: all 0.2s;
            -moz-appearance: textfield;
        }

        .fraction-input::-webkit-outer-spin-button,
        .fraction-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .fraction-input:focus {
            border: 2px solid #ff9800;
            background-color: #fff3e0;
        }

        .fraction-line {
            width: 75px;
            height: 3px;
            background-color: #8d6e63;
            margin: 6px 0;
            border-radius: 2px;
        }

        .check-btn {
            margin-top: 35px;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
            transition: all 0.2s;
        }

        .check-btn:hover {
            background-color: #e65100;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 152, 0, 0.4);
        }

        .correct {
            background-color: #e8f5e9 !important;
            border-color: #4caf50 !important;
            color: #2e7d32 !important;
        }

        .incorrect {
            background-color: #ffebee !important;
            border-color: #f44336 !important;
            color: #c62828 !important;
        }

        /* התאמות למובייל ומסכים קטנים מאוד */
        @media (max-width: 600px) {
            /* 15.09.26 — 16px/17px broke the unit's permanent 18px floor. */
            th, td {
                padding: 12px 8px;
                font-size: 18px;
            }
            .breed-cell {
                font-size: 18px;
            }
            .title-container h1 {
                font-size: 26px;
            }
        }
    </style>
<style id="qa-scrollfix">
html { overflow: hidden; }
body::-webkit-scrollbar { width: 10px; }
body::-webkit-scrollbar-track { background: #EFEFEF; border-radius: 100px; }
/* 07.09, producer: grey. It was #019DE5 — the science blue — in a maths unit. */
body::-webkit-scrollbar-thumb { background: #AEAEAE; border-radius: 100px; }
body { scrollbar-color: #AEAEAE #EFEFEF; scrollbar-width: thin; }
</style>
<script id="qa-scrollwrap">
/* scrollbar on the physical right (client design QA): body becomes an LTR
   scroll container; a wrapper inherits its layout and keeps content RTL */
document.addEventListener('DOMContentLoaded', function () {
  var b = document.body, cs = getComputedStyle(b), w = document.createElement('div');
  ['display','flexDirection','alignItems','justifyContent','gap','padding','boxSizing']
    .forEach(function (k) { w.style[k] = cs[k]; });
  w.style.direction = 'rtl';
  w.style.minHeight = '100vh';
  w.style.boxSizing = 'border-box';  /* min-height:100vh must include the padding, else the body always overflows by the padding amount */
  while (b.firstChild) w.appendChild(b.firstChild);
  b.appendChild(w);
  b.style.cssText += ';padding:0;margin:0;display:block;direction:ltr;height:100vh;overflow-y:auto;';
});
</script><style id="qa-fontnorm">
h1 { font-size: 24px !important; font-weight: 700 !important; }
h2 { font-size: 20px !important; font-weight: 700 !important; }
/* 15.09.26 — every 16px here broke the unit's permanent 18px floor. */
.subtitle, .sub, p.lead { font-size: 18px !important; font-weight: 400 !important; }
.card-header { font-size: 18px !important; font-weight: 700 !important; }
label { font-size: 18px !important; font-weight: 600 !important; }
input[type="number"], input[type="text"], select { font-size: 18px !important; font-weight: 600 !important; }
.ratio-badge, .result, .badge { font-size: 18px !important; font-weight: 600 !important; color: #303030 !important; }
button { font-size: 18px !important; }
</style></head>
<body>

    <div class="title-container">
        <h1>🐾 مهمة النسب: أوزان الكلاب 🐶</h1>
        <p>استعينوا بالجدول لحساب النسبة بين وزن الجرو ووزن الكلب البالغ</p>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>سلالة الكلب</th>
                    <th>وزن الجرو (بعمر 3 أشهر)</th>
                    <th>وزن الكلب البالغ</th>
                    <th>النسبة بين وزن الجرو ووزن الكلب البالغ</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>
    </div>

    <button class="check-btn" onclick="checkRatios()">افحص إجاباتي 🐕</button>

    <script>
        const dogsData = [
            { breed: "داكسهند", emoji: "🌭", puppy: 4, adult: 12 },
            { breed: "لابرادور", emoji: "🦮", puppy: 11, adult: 33 },
            { breed: "الراعي البلجيكي", emoji: "🐕", puppy: 10, adult: 30 },
            { breed: "بينشر", emoji: "🐕‍🦺", puppy: 2.5, adult: 6.5 },
            { breed: "بوردر كولي", emoji: "🐩", puppy: 6, adult: 18 }
        ];

        const tableBody = document.getElementById('table-body');

        dogsData.forEach((dog, index) => {
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td class="breed-cell">${dog.emoji} ${dog.breed}</td>
                <td><strong>${dog.puppy}</strong> كغ</td>
                <td><strong>${dog.adult}</strong> كغ</td>
                <td>
                    <div class="fraction-container" data-puppy="${dog.puppy}" data-adult="${dog.adult}">
                        <input type="number" class="fraction-input num" min="0.5" step="0.5"
                               onkeydown="if(['-', '+', 'e', 'E'].includes(event.key)) event.preventDefault();">
                        <div class="fraction-line"></div>
                        <input type="number" class="fraction-input den" min="0.5" step="0.5"
                               onkeydown="if(['-', '+', 'e', 'E'].includes(event.key)) event.preventDefault();">
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });

        document.querySelectorAll('.fraction-input').forEach(input => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9.]/g, '');
                if ((this.value.match(/\./g) || []).length > 1) {
                    this.value = this.value.replace(/\.+$/, "");
                }
            });
        });

        function checkRatios() {
            const containers = document.querySelectorAll('.fraction-container');
            
            containers.forEach(container => {
                const puppyWeight = parseFloat(container.getAttribute('data-puppy'));
                const adultWeight = parseFloat(container.getAttribute('data-adult'));
                
                const numInput = container.querySelector('.num');
                const denInput = container.querySelector('.den');
                
                const numVal = parseFloat(numInput.value);
                const denVal = parseFloat(denInput.value);

                numInput.classList.remove('correct', 'incorrect');
                denInput.classList.remove('correct', 'incorrect');

                if (!isNaN(numVal) && !isNaN(denVal) && denVal > 0 && numVal > 0) {
                    const expectedRatio = puppyWeight / adultWeight;
                    const studentRatio = numVal / denVal;

                    if (Math.abs(expectedRatio - studentRatio) < 0.001) {
                        numInput.classList.add('correct');
                        denInput.classList.add('correct');
                    } else {
                        numInput.classList.add('incorrect');
                        denInput.classList.add('incorrect');
                    }
                }
            });
        }
    </script>


<style id="no-step">
/* 30.09, producer: number inputs never offer a "step" — no spinner buttons,
   no arrow-key stepping, no scroll-wheel stepping. The learner types a value.
   `step` is left on the element where it exists because it also governs
   validity; only the STEPPING UI is removed. */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
</style>
<script id="no-step-js">
(function () {
  var block = function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'INPUT' || t.type !== 'number') return;
    if (e.type === 'wheel') { t.blur(); return; }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  };
  document.addEventListener('keydown', block, true);
  document.addEventListener('wheel', block, { passive: true, capture: true });
})();
</script>
</body>
</html>

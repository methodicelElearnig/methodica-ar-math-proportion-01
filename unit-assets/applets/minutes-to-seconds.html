<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعة إيقاف: التحويل من الثواني:الدقائق إلى ثوانٍ</title>
    <style>
        body {
            font-family: Calibri, Carlito, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
            background-color: #0f172a; /* רקע כהה ויוקרתי בסגנון הייטק */
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .converter-container {
            max-width: 480px;
            width: 100%;
            background: #1e293b; /* מכולה כהה */
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 2px solid #334155;
            text-align: center;
        }
        h1 {
            color: #38bdf8; /* כחול שמיים בהיר */
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .explanation {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            display: block;
            font-weight: bold;
            color: #e2e8f0;
            margin-bottom: 12px;
            font-size: 16px;
        }
        
        /* עיצוב המראה של שעון העצר הדיגיטלי */
        .stopwatch-display {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617; /* מסך שעון שחור עמוק */
            border: 4px solid #22c55e; /* מסגרת ירוקה זוהרת */
            border-radius: 80px; /* מראה אובלי/עגול של סטופר */
            padding: 15px 40px;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2), inset 0 0 15px rgba(0,0,0,0.6);
            position: relative;
            animation: pulse-border 2s infinite alternate;
        }
        
        @keyframes pulse-border {
            0% { box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
            100% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.4); }
        }

        .time-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        /* לחצני החצים המעוצבים */
        .arrow-btn {
            background: none;
            border: none;
            color: #16a34a; /* ירוק כהה יותר כברירת מחדל */
            font-size: 20px;
            cursor: pointer;
            padding: 2px;
            line-height: 1;
            user-select: none;
            transition: color 0.1s, transform 0.1s;
        }
        .arrow-btn:hover {
            color: #4ade80; /* זוהר בזמן ריחוף */
        }
        .arrow-btn:active {
            transform: scale(1.2); /* אפקט לחיצה קינטי */
        }
        
        /* תיבות הטקסט שנראות כמו ספרות דיגיטליות בשעון */
        .time-field {
            border: none;
            background: transparent;
            font-family: monospace, system-ui;
            font-size: 48px; /* ספרות גדולות */
            font-weight: bold;
            width: 85px;
            text-align: center;
            color: #22c55e; /* צבע ירוק דיגיטלי זוהר */
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
            margin: -5px 0; /* מצמצם את המרווח שנוצר בגלל החצים */
        }
        
        /* ביטול חצי הגלילה המובנים והמכוערים של הדפדפן */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .time-field:focus {
            outline: none;
            color: #4ade80; 
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.8);
        }
        
        .time-label-sub {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        
        .time-separator {
            font-size: 42px;
            font-weight: bold;
            color: #22c55e;
            margin: 0 10px;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
            animation: blink 1s infinite;
            display: inline-block;
            align-self: center;
            margin-top: -15px; /* איזון גובה מול החצים */
        }
        
        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
            margin-bottom: 25px;
        }
        .btn:hover {
            background-color: #0ea5e9;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(14, 165, 233, 0.3);
        }
        
        /* לוח התוצאות הדיגיטלי */
        .result-box {
            background-color: #020617;
            border: 1px solid #334155;
            padding: 22px;
            border-radius: 16px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }
        .result-text {
            font-size: 15px;
            color: #94a3b8;
        }
        .result-val {
            font-size: 32px;
            font-weight: bold;
            color: #38bdf8; /* התוצאה זוהרת בכחול */
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            margin-top: 8px;
        }
        .calculation-steps {
            font-size: 12px;
            color: #64748b;
            margin-top: 12px;
            background: #1e293b;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            display: inline-block;
        }
    </style>
<style id="qa-scrollfix">
html { overflow: hidden; }
body::-webkit-scrollbar { width: 10px; }
body::-webkit-scrollbar-track { background: #EFEFEF; border-radius: 100px; }
/* 07.09, producer: grey. It was #019DE5 — the science blue — in a maths unit. */
body::-webkit-scrollbar-thumb { background: #AEAEAE; border-radius: 100px; }
body { scrollbar-color: #AEAEAE #EFEFEF; scrollbar-width: thin; }
</style>
<script id="qa-scrollwrap">
/* scrollbar on the physical right (client design QA): body becomes an LTR
   scroll container; a wrapper inherits its layout and keeps content RTL */
document.addEventListener('DOMContentLoaded', function () {
  var b = document.body, cs = getComputedStyle(b), w = document.createElement('div');
  ['display','flexDirection','alignItems','justifyContent','gap','padding','boxSizing']
    .forEach(function (k) { w.style[k] = cs[k]; });
  w.style.direction = 'rtl';
  w.style.minHeight = '100vh';
  w.style.boxSizing = 'border-box';  /* min-height:100vh must include the padding, else the body always overflows by the padding amount */
  while (b.firstChild) w.appendChild(b.firstChild);
  b.appendChild(w);
  b.style.cssText += ';padding:0;margin:0;display:block;direction:ltr;height:100vh;overflow-y:auto;';
});
</script><style id="qa-fontnorm">
h1 { font-size: 24px !important; font-weight: 700 !important; }
h2 { font-size: 20px !important; font-weight: 700 !important; }
.subtitle, .sub, p.lead { font-size: 16px !important; font-weight: 400 !important; }
.card-header { font-size: 18px !important; font-weight: 700 !important; }
label { font-size: 16px !important; font-weight: 600 !important; }
input[type="number"], input[type="text"], select { font-size: 18px !important; font-weight: 600 !important; }
.ratio-badge, .result, .badge { font-size: 16px !important; font-weight: 600 !important; color: #303030 !important; }
button { font-size: 16px !important; }
</style></head>
<body>

<div class="converter-container">
    <h1>ساعة إيقاف لتحويل الزمن</h1>
    <div class="explanation">ضعوا قيمًا داخل شاشة الساعة: <b>أدخلوا الزمن بالثواني:الدقائق</b> واكتشفوا عدد الثواني الكلي!</div>

    <div class="input-group">
        <label>اضبطوا ساعة الإيقاف (الثواني:الدقائق):</label>
        
        <div class="stopwatch-display">
            
            <div class="time-column">
                <input type="number" id="secField" class="time-field" min="0" max="59" placeholder="00" value="00">
                <span class="time-label-sub">ثوانٍ</span>
            </div>
            
            <span class="time-separator">:</span>
            
            <div class="time-column">
                <input type="number" id="minField" class="time-field" min="0" max="999" placeholder="00" value="0">
                <span class="time-label-sub">دقائق</span>
            </div>

        </div>
    </div>

    <button id="convertBtn" class="btn">شغّلوا حساب الثواني</button>

    <div class="result-box">
        <div id="resultOutput" class="result-text">غيّروا الأرقام في الساعة لرؤية النتيجة بعد التحويل</div>
    </div>
</div>

<script>
    const minField = document.getElementById('minField');
    const secField = document.getElementById('secField');
    const convertBtn = document.getElementById('convertBtn');
    const resultOutput = document.getElementById('resultOutput');

    // לחצני חצים
    const minUp = document.getElementById('minUp');
    const minDown = document.getElementById('minDown');
    const secUp = document.getElementById('secUp');
    const secDown = document.getElementById('secDown');

    function padZero(num) {
        return num.toString().padStart(2, '0');
    }

    function performConversion() {
        let mins = parseInt(minField.value) || 0;
        let secs = parseInt(secField.value) || 0;

        // הגבלות והגנות על טווחי הזמן בשעון
        if (secs > 59) {
            secs = 59;
            secField.value = 59;
        }
        if (secs < 0) {
            secs = 0;
            secField.value = '00';
        }
        if (mins < 0) {
            mins = 0;
            minField.value = 0;
        }

        // חישוב המרה
        const totalSeconds = (mins * 60) + secs;

        resultOutput.innerHTML = `
            <div>الزمن المضبوط على الساعة يساوي:</div>
            <div class="result-val">${totalSeconds.toLocaleString('en-US')} ثانية</div>
            <div class="calculation-steps">
                صيغة التحويل: (${mins} دقيقة × 60) + ${secs} ثانية = ${totalSeconds}
            </div>
        `;
    }

    // פונקציות לעדכון בלחיצה על החצים
    if (minUp) minUp.addEventListener('click', () => {
        let val = parseInt(minField.value) || 0;
        minField.value = val + 1;
        performConversion();
    });

    if (minDown) minDown.addEventListener('click', () => {
        let val = parseInt(minField.value) || 0;
        if (val > 0) {
            minField.value = val - 1;
            performConversion();
        }
    });

    if (secUp) secUp.addEventListener('click', () => {
        let val = parseInt(secField.value) || 0;
        if (val < 59) {
            secField.value = padZero(val + 1);
        } else {
            // התנהגות שעון: מעבר מ-59 ל-00 מעלה דקה
            secField.value = '00';
            minField.value = (parseInt(minField.value) || 0) + 1;
        }
        performConversion();
    });

    if (secDown) secDown.addEventListener('click', () => {
        let val = parseInt(secField.value) || 0;
        if (val > 0) {
            secField.value = padZero(val - 1);
        } else {
            // התנהגות שעון: ירידה מ-00 ל-59 מורידה דקה
            let mins = parseInt(minField.value) || 0;
            if (mins > 0) {
                minField.value = mins - 1;
                secField.value = '59';
            }
        }
        performConversion();
    });

    // הפעלה ועדכון אוטומטיים בזמן אמת מהמקלדת
    minField.addEventListener('input', performConversion);
    secField.addEventListener('input', performConversion);
    
    // סידור אסתטי של הספרות כשהתלמיד יוצא מהשדה
    secField.addEventListener('blur', () => {
        secField.value = padZero(parseInt(secField.value) || 0);
    });
    minField.addEventListener('blur', () => {
        minField.value = parseInt(minField.value) || 0;
    });

    convertBtn.addEventListener('click', performConversion);

    // הרצה ראשונית עם עליית הדף
    performConversion();
</script>


<style id="no-step">
/* 30.09, producer: number inputs never offer a "step" — no spinner buttons,
   no arrow-key stepping, no scroll-wheel stepping. The learner types a value.
   `step` is left on the element where it exists because it also governs
   validity; only the STEPPING UI is removed. */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
</style>
<script id="no-step-js">
(function () {
  var block = function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'INPUT' || t.type !== 'number') return;
    if (e.type === 'wheel') { t.blur(); return; }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  };
  document.addEventListener('keydown', block, true);
  document.addEventListener('wheel', block, { passive: true, capture: true });
})();
</script>
</body>
</html>

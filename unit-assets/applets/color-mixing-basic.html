<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استكشاف التناسب في الألوان 🎨</title>
    <style>
        body {
            font-family: Calibri, Carlito, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        .containers-wrapper {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 900px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 340px;
            text-align: center;
            border: 2px solid #eef2f5;
            position: relative;
        }
        .card-title {
            margin-top: 0;
            font-size: 1.4em;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f2f5;
        }
        .container-roey .card-title { color: #2a9d8f; }
        .container-student .card-title { color: #e76f51; }
        
        .color-input {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label { font-weight: bold; font-size: 1.05em; }
        input[type="number"] {
            width: 80px;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #ddd;
            text-align: center;
            font-size: 1.1em;
        }
        input[type="number"]:focus {
            border-color: #007bff;
            outline: none;
        }
        input[type="number"]:disabled {
            background-color: #f0f0f0;
            color: #666;
            border-color: #e0e0e0;
            cursor: not-allowed;
        }
        .preview-box {
            width: 100%;
            height: 130px;
            border-radius: 12px;
            margin-top: 25px;
            border: 1px solid #ddd;
            background-color: #ddd;
            transition: background-color 0.2s ease;
        }
        .result-info {
            margin-top: 12px;
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            min-height: 70px;
        }
        .ratio-badge {
            display: inline-block;
            background: #f0f2f5;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #555;
            margin-top: 6px;
        }
        .shade-name {
            font-size: 0.95em;
            color: #888;
            margin-top: 4px;
            font-weight: normal;
        }
    
        /* 15.09.26 — the number spinner sits INSIDE the box and steals layout
           width, so `text-align: center` rendered the digit off-centre (in RTL
           the spinner is on the left, so the number drifted right). Same
           treatment the other applets in this unit already carry. */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
</style>
<style id="qa-scrollfix">
html { overflow: hidden; }
body::-webkit-scrollbar { width: 10px; }
body::-webkit-scrollbar-track { background: #EFEFEF; border-radius: 100px; }
/* 07.09, producer: grey. It was #019DE5 — the science blue — in a maths unit. */
body::-webkit-scrollbar-thumb { background: #AEAEAE; border-radius: 100px; }
body { scrollbar-color: #AEAEAE #EFEFEF; scrollbar-width: thin; }
</style>
<script id="qa-scrollwrap">
/* scrollbar on the physical right (client design QA): body becomes an LTR
   scroll container; a wrapper inherits its layout and keeps content RTL */
document.addEventListener('DOMContentLoaded', function () {
  var b = document.body, cs = getComputedStyle(b), w = document.createElement('div');
  ['display','flexDirection','alignItems','justifyContent','gap','padding','boxSizing']
    .forEach(function (k) { w.style[k] = cs[k]; });
  w.style.direction = 'rtl';
  w.style.minHeight = '100vh';
  w.style.boxSizing = 'border-box';  /* min-height:100vh must include the padding, else the body always overflows by the padding amount */
  while (b.firstChild) w.appendChild(b.firstChild);
  b.appendChild(w);
  b.style.cssText += ';padding:0;margin:0;display:block;direction:ltr;height:100vh;overflow-y:auto;';
});
</script><style id="qa-fontnorm">
/* uniform type scale (client design QA 22/07) */
h1 { font-size: 24px !important; font-weight: 700 !important; }
.subtitle { font-size: 16px !important; font-weight: 400 !important; }
.card-header { font-size: 18px !important; font-weight: 700 !important; }
label { font-size: 16px !important; font-weight: 600 !important; }
input[type="number"] { font-size: 18px !important; font-weight: 600 !important; }
.ratio-badge { font-size: 16px !important; font-weight: 600 !important; color: #303030 !important; }
.color-preview-label, .preview-label, .bowl-note { font-size: 15px !important; }
button, .btn { font-size: 16px !important; }
</style></head>
<body>

    <h1>استكشاف التناسب: تحدّي الخلط عند تامر 🧪</h1>
    <div class="subtitle">
        حضّر تامر وعاء ألوان بنسبة ثابتة. <br>
        أدخلوا كميات لوعائكم وافحصوا: هل نجحتم في الحصول على درجة اللون نفسها تمامًا؟
    </div>

    <div class="containers-wrapper">
        
        <!-- הקערה של רועי (קבועה) -->
        <div class="card container-roey">
            <div class="card-title">🥣 وعاء تامر</div>
            
            <div class="color-input">
                <label style="color: #e63946;">🔴 عدد ملاعق اللون الأحمر:</label>
                <input type="number" id="red-Roey" value="3" disabled>
            </div>
            
            <div class="color-input">
                <label style="color: #555;">⚪ عدد ملاعق اللون الأبيض:</label>
                <input type="number" id="white-Roey" value="4" disabled>
            </div>

            <div id="preview-box-Roey" class="preview-box"></div>
            <div id="result-info-Roey" class="result-info"></div>
        </div>

        <!-- קערה של תלמיד/ה אחר/ת (ניתנת לשינוי) -->
        <div class="card container-student">
            <div class="card-title">🥣 وعاء طالب أو طالبة آخر</div>
            
            <div class="color-input">
                <label style="color: #e63946;">🔴 عدد ملاعق اللون الأحمر:</label>
                <input type="number" id="red-Student" value="0" min="0" oninput="mix('Student')">
            </div>
            
            <div class="color-input">
                <label style="color: #555;">⚪ عدد ملاعق اللون الأبيض:</label>
                <input type="number" id="white-Student" value="0" min="0" oninput="mix('Student')">
            </div>

            <div id="preview-box-Student" class="preview-box"></div>
            <div id="result-info-Student" class="result-info">الوعاء فارغ</div>
        </div>

    </div>

    <script>
        const BASE_COLORS = {
            red: { r: 255, g: 0, b: 0 },
            white: { r: 255, g: 255, b: 255 }
        };

        // פונקציה למציאת מחלק משותף מקסימלי לצמצום שברים
        function gcd(a, b) {
            return b ? gcd(b, a % b) : a;
        }

        // פונקציה להחזרת שם הגוון לפי אחוז האדום
        function getShadeName(redRatio) {
            if (redRatio > 0.6) return "وردي توتي غامق 🌺";
            if (redRatio >= 0.4 && redRatio <= 0.6) return "وردي علكة كلاسيكي 🌸";
            return "وردي بيبي ناعم 💮";
        }

        function mix(id) {
            const redUnits = parseFloat(document.getElementById(`red-${id}`).value) || 0;
            const whiteUnits = parseFloat(document.getElementById(`white-${id}`).value) || 0;
            
            const totalUnits = redUnits + whiteUnits;
            const previewBox = document.getElementById(`preview-box-${id}`);
            const resultInfo = document.getElementById(`result-info-${id}`);

            if (totalUnits === 0) {
                previewBox.style.backgroundColor = '#ddd';
                resultInfo.innerHTML = "الوعاء فارغ";
                return;
            }

            // חישוב צבע משוקלל
            const finalR = Math.round((BASE_COLORS.red.r * redUnits + BASE_COLORS.white.r * whiteUnits) / totalUnits);
            const finalG = Math.round((BASE_COLORS.red.g * redUnits + BASE_COLORS.white.g * whiteUnits) / totalUnits);
            const finalB = Math.round((BASE_COLORS.red.b * redUnits + BASE_COLORS.white.b * whiteUnits) / totalUnits);

            const rgbResult = `rgb(${finalR}, ${finalG}, ${finalB})`;
            previewBox.style.backgroundColor = rgbResult;

            // חישוב יחס מצומצם לשם התצוגה
            const divisor = gcd(redUnits, whiteUnits);
            const simplifiedRed = divisor > 0 ? (redUnits / divisor).toFixed(0) : 0;
            const simplifiedWhite = divisor > 0 ? (whiteUnits / divisor).toFixed(0) : 0;
            
            const shadeText = getShadeName(redUnits / totalUnits);

            resultInfo.innerHTML = `
                <div>درجة اللون الناتجة</div>
                <div class="shade-name">${shadeText}</div>
                <div class="ratio-badge">نسبة الأحمر إلى الأبيض: ${simplifiedWhite} : ${simplifiedRed}</div>
            `;
        }

        // הפעלה ראשונית עבור הקערה של רועי שתהיה צבועה מההתחלה
        mix('Roey');
    </script>

<style id="no-step">
/* 30.09, producer: number inputs never offer a "step" — no spinner buttons,
   no arrow-key stepping, no scroll-wheel stepping. The learner types a value.
   `step` is left on the element where it exists because it also governs
   validity; only the STEPPING UI is removed. */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
</style>
<script id="no-step-js">
(function () {
  var block = function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'INPUT' || t.type !== 'number') return;
    if (e.type === 'wheel') { t.blur(); return; }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  };
  document.addEventListener('keydown', block, true);
  document.addEventListener('wheel', block, { passive: true, capture: true });
})();
</script>
</body>
</html>
